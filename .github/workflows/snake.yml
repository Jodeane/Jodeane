name: Generate network-themed contribution snake

on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:23 UTC; GitHub may delay scheduled workflows.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark blue-teal SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#008FAC&color_dots=#E9F5FA,#C4EAF4,#82D4E8,#29B7CF,#0586A7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22D8C6&color_dots=#071522,#163B4F,#126B89,#0FA9BE,#38E4D3

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
