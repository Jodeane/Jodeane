<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="420" height="465" viewBox="0 0 420 465">
  <title id="title">Network engineer topology illustration</title>
  <desc id="desc">A cloud connects through a firewall and router to a switch with two end devices. Cyan and teal packet paths depict secure connectivity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6FCFF"/><stop offset="1" stop-color="#E6F9FC"/></linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#197AB6"/><stop offset="1" stop-color="#009DCA"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse"><path d="M21 0H0V21" fill="none" stroke="#CEE3F1" stroke-width=".7"/></pattern>
  </defs>
  <rect x="2" y="2" width="416" height="461" rx="27" fill="url(#bg)" stroke="#B3D9EC" stroke-width="2"/>
  <rect x="15" y="15" width="390" height="435" rx="20" fill="url(#grid)" opacity=".5"/>
  <circle cx="43" cy="39" r="4" fill="#16C8BE"/><circle cx="58" cy="39" r="4" fill="#009DCA"/><circle cx="73" cy="39" r="4" fill="#197AB6"/>
  <text x="210" y="43" text-anchor="middle" fill="#50728A" font-size="12" font-weight="700" letter-spacing="2" font-family="Arial, sans-serif">NETWORK TOPOLOGY</text>
  <path d="M210 119V156M210 204V235M210 284V316M210 362V376M210 362H113V376M210 362H307V376" stroke="url(#cable)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M210 119V156M210 204V235M210 284V316M210 362V376M210 362H113V376M210 362H307V376" stroke="#009DCA" stroke-width="1" stroke-dasharray="4 7" fill="none"/>
  <g filter="url(#glow)"><circle cx="210" cy="137" r="4" fill="#16C8BE"/><circle cx="210" cy="220" r="4" fill="#16C8BE"/><circle cx="113" cy="362" r="4" fill="#16C8BE"/><circle cx="307" cy="362" r="4" fill="#16C8BE"/></g>
  <g fill="#FFFFFF" stroke="#B3D9EC" stroke-width="2"><rect x="144" y="69" width="132" height="50" rx="17"/><rect x="137" y="157" width="146" height="47" rx="13"/><rect x="144" y="235" width="132" height="49" rx="14"/><rect x="138" y="316" width="144" height="47" rx="12"/><rect x="54" y="376" width="118" height="49" rx="12"/><rect x="248" y="376" width="118" height="49" rx="12"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#153954" font-weight="700" font-size="14"><text x="210" y="91">CLOUD</text><text x="210" y="108" fill="#50728A" font-size="9" letter-spacing="1">UPLINK</text><text x="210" y="184">FIREWALL</text><text x="210" y="263">CORE ROUTER</text><text x="210" y="344">SWITCH</text><text x="113" y="404" font-size="12">CLIENT A</text><text x="307" y="404" font-size="12">CLIENT B</text></g>
  <g fill="#16C8BE"><circle cx="152" cy="180" r="3"/><circle cx="158" cy="258" r="3"/><circle cx="151" cy="339" r="3"/></g>
  <text x="210" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#009DCA">ROUTE  •  SECURE  •  CONNECT</text>
</svg>